services:
  redis:
    image: redis:7-alpine
    container_name: redis_broker
    networks:
      - db_network
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Vector Database
  vector-db:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    container_name: vector_store
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_secure_password}
      POSTGRES_DB: ${DB_NAME:-trading_data}
    ports:
      - "5432:5432"
    networks:
      - db_network
    volumes:
      - vector-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Performance tuning for PG18 & 768d vectors
    command: >
      postgres
      -c max_wal_size=4GB
      -c maintenance_work_mem=1GB
      -c work_mem=64MB
      -c shared_buffers=2GB

networks:
  db_network:
    driver: bridge
    external: true

volumes:
  redis-data:
    external: true
  vector-data:
    external: true
